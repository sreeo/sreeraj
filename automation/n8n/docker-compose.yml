# n8n control plane + CPU decision model for the sreeraj.dev monthly redesign.
# Binds to localhost only. To reach the UI over Tailscale, add a docker-compose.override.yml
# (see docker-compose.override.example.yml).
name: redesign-n8n
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678/
      # Plain HTTP: localhost, or a tailnet where WireGuard already encrypts it.
      - N8N_SECURE_COOKIE=false
      - GENERIC_TIMEZONE=UTC
      - TZ=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    extra_hosts:
      # The SSH node reaches the host's gh CLI through this name.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    mem_limit: 1g

  decider:
    # Jev-style typed decisions on CPU: Mapika/decider GGUF (Apache-2.0) behind /v1/systemone.
    image: redesign-decider:1.8.1
    build: ./decider
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DECIDER_REPO=${DECIDER_REPO:-Mapika/decider-4b-GGUF}
      - DECIDER_GGUF=${DECIDER_GGUF:-decider-4b-v2.1-Q4_K_M.gguf}
      - DECIDER_THREADS=${DECIDER_THREADS:-4}
      - DECIDER_CTX=8192
    volumes:
      - hf_cache:/hf
    mem_limit: 4g

volumes:
  n8n_data:
  hf_cache:
