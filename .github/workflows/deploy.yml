name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so rebuild-archives can git-worktree each
          # edition's source (edition/<month> tags).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Rebuild every archived edition from its source with the CURRENT content,
      # so new blog posts appear in past designs too. Non-blocking: a failure
      # here must not block the deploy (the committed archives remain a fallback).
      - name: Rebuild archived editions with current content
        run: npm run archives:rebuild || echo "::warning::archive rebuild failed; deploying committed archives as-is"
      - run: npm run build
      # Guard: every edition listed in the archive registry MUST have a servable
      # snapshot in the built output. Fails the deploy loudly rather than
      # shipping a /archive/<month>/ that 404s (the failure mode from 2026-06).
      - name: Verify all archive editions are servable
        run: |
          node -e '
            const fs = require("fs");
            const reg = JSON.parse(fs.readFileSync("public/archive/registry.json", "utf8"));
            const missing = (reg.archives || [])
              .map(a => a.month)
              .filter(m => !fs.existsSync(`dist/archive/${m}/index.html`));
            if (missing.length) {
              console.error(`::error::Archive editions missing a built snapshot: ${missing.join(", ")}. /archive/<month>/ would 404.`);
              process.exit(1);
            }
            console.log(`All ${(reg.archives||[]).length} archive edition(s) present in dist.`);
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
